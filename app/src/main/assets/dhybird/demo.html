<!DOCTYPE html>
<html>
<head lang="zh-cmn-Hans">
    <meta charset="UTF-8">
    <title>hybird v2 Bridge Test</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
    <script src="./dhsdk.js"></script>
</head>
<style>
    .btn {
        text-align: center;
        background: #d8d8d8;
        color: #222;
        padding: 20px;
        margin: 30px;
        font-size: 24px;
        border-radius: 4px;
        box-shadow: 4px 2px 10px #999;
    }

    .btn:active {
        opacity: .7;
        box-shadow: 4px 2px 10px #555;
    }


</style>
<body>
<div class="btn" onclick="ready()">ready</div>
<div class="btn" onclick="showToast()">ShowToast</div>
<div class="btn" onclick="checkAvailable()">checkAvailable</div>

<script>
    function ready() {
        dhsdk.ready().then(function () {
            console.log('Bridge Ready');
            alert('Bridge Ready');
        }).catch(function (error) {
            console.error(error);
            alert(error.errorMessage || 'Bridge unavailable');
        });
    };

    function showToast() {
        dhsdk.invoke('common.showToast', {
            "title":"测试",
            "icon":"test.png",
            "duration":"1500"
        }).then(function (data) {
            console.log('调用成功', data);
        }).catch(function (error) {
            console.error('调用失败', error);
        });
    }

    function checkAvailable() {
        dhsdk.invoke('common.checkAvailable', {
            'available':['common.closeHybird', 'user.getToken' ,'common.showToast']
        }).then(function (data) {
            alert(JSON.stringify(data));
        }).catch(function (error) {
            alert(error.errorMessage || '检查失败');
        });
    }

    dhsdk.on('refreshToken', function (data) {
        alert(JSON.stringify(data));
    });

</script>
</body>
</html>
